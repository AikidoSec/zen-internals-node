name: CI

on:
  push:
  workflow_call:

permissions: {}

jobs:
  prebuild:
    name: Prebuild ${{ matrix.os }} ${{ matrix.arch }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-15-intel,
            macos-latest,
            windows-2022,
          ]
        # Node 17 excluded: V8 callback doesn't work correctly
        node: [16, 18, 19, 20, 21, 22, 23, 24, 25, 26]
        exclude:
          - os: macos-latest
            node: 16
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: windows-2022
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}.x

      - name: Install dependencies
        run: npm install --ignore-scripts

      # Python 3.12+ removed distutils, but node-gyp needs it
      - name: Setup Python 3.11 for node-gyp
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Get current node version without "v" prefix (e.g., "20.15.0")
      - name: Build prebuild
        run: npx prebuildify --strip -t $(node -p "process.version.slice(1)")

      - name: Run tests
        run: npm test

      - name: Run IP matcher benchmark
        run: npm run benchmark:ip-matcher

      - name: Rename prebuild with platform and Node version
        run: |
          for dir in prebuilds/*/; do
            platform=$(basename "$dir")
            mv "$dir/zen-internals-node.node" "prebuilds/zen-internals-node-$platform-node${{ matrix.node }}.node"
          done
        shell: bash

      - name: Upload prebuild
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-${{ matrix.os }}-${{ matrix.arch }}-node${{ matrix.node }}
          path: prebuilds/
          retention-days: 30

  prebuild-musl:
    name: Prebuild Linux musl ${{ matrix.arch }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        # Node 17 excluded: V8 callback doesn't work correctly
        node: [16, 18, 19, 20, 21, 22, 23, 24, 25, 26]
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in Alpine container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace node:${{ matrix.node }}-alpine sh -c "
            apk add --no-cache python3 make g++ &&
            npm install --ignore-scripts &&
            npx prebuildify --strip -t \$(node -p 'process.version.slice(1)') &&
            npm test &&
            npm run benchmark:ip-matcher &&
            for dir in prebuilds/*/; do
              platform=\$(basename \"\$dir\")
              mv \"\$dir/zen-internals-node.node\" \"prebuilds/zen-internals-node-\${platform}-musl-node${{ matrix.node }}.node\"
            done
          "

      - name: Upload prebuild
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-musl-${{ matrix.arch }}-node${{ matrix.node }}
          path: prebuilds/
          retention-days: 30
