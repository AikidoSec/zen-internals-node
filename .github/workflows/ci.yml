name: CI

on:
  push:
  workflow_call:

permissions: {}

jobs:
  prebuild:
    name: Prebuild ${{ matrix.os }} ${{ matrix.arch }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-15-intel,
            macos-latest,
            windows-2022,
          ]
        # Node 17 excluded: V8 callback doesn't work correctly
        node: [16, 18, 19, 20, 21, 22, 23, 24, 25, 26]
        exclude:
          - os: macos-latest
            node: 16
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: windows-2022
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}.x

      - name: Install dependencies
        run: npm install --ignore-scripts

      # Python 3.12+ removed distutils, but node-gyp needs it
      - name: Setup Python 3.11 for node-gyp
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Get current node version without "v" prefix (e.g., "20.15.0")
      - name: Build prebuild
        run: npx prebuildify --strip -t $(node -p "process.version.slice(1)")

      - name: Run tests
        run: npm test

      - name: Run IP matcher benchmark
        run: npm run benchmark:ip-matcher

      - name: Rename prebuild with platform and Node version
        run: |
          for dir in prebuilds/*/; do
            platform=$(basename "$dir")
            mv "$dir/zen-internals-node.node" "prebuilds/zen-internals-node-$platform-node${{ matrix.node }}.node"
          done
        shell: bash

      - name: Upload prebuild
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-${{ matrix.os }}-${{ matrix.arch }}-node${{ matrix.node }}
          path: prebuilds/
          retention-days: 30

  prebuild-musl:
    name: Prebuild Linux musl ${{ matrix.arch }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        # Node 17 excluded: V8 callback doesn't work correctly
        node: [16, 18, 19, 20, 21, 22, 23, 24, 25, 26]
        include:
          - os: ubuntu-latest
            arch: x64
            node: 16
            image: node:16-alpine@sha256:a1f9d027912b58a7c75be7716c97cfbc6d3099f3a97ed84aa490be9dee20e787
          - os: ubuntu-latest
            arch: x64
            node: 18
            image: node:18-alpine@sha256:8d6421d663b4c28fd3ebc498332f249011d118945588d0a35cb9bc4b8ca09d9e
          - os: ubuntu-latest
            arch: x64
            node: 19
            image: node:19-alpine@sha256:8ec543d4795e2e85af924a24f8acb039792ae9fe8a42ad5b4bf4c277ab34b62e
          - os: ubuntu-latest
            arch: x64
            node: 20
            image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
          - os: ubuntu-latest
            arch: x64
            node: 21
            image: node:21-alpine@sha256:78c45726ea205bbe2f23889470f03b46ac988d14b6d813d095e2e9909f586f93
          - os: ubuntu-latest
            arch: x64
            node: 22
            image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          - os: ubuntu-latest
            arch: x64
            node: 23
            image: node:23-alpine@sha256:a34e14ef1df25b58258956049ab5a71ea7f0d498e41d0b514f4b8de09af09456
          - os: ubuntu-latest
            arch: x64
            node: 24
            image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          - os: ubuntu-latest
            arch: x64
            node: 25
            image: node:25-alpine@sha256:bdf2cca6fe3dabd014ea60163eca3f0f7015fbd5c7ee1b0e9ccb4ced6eb02ef4
          - os: ubuntu-latest
            arch: x64
            node: 26
            image: node:26-alpine@sha256:0b36e8c136b94cd4fcf02188228e76c31ad5872eef3fec8cbd2eee500cfd9e80
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 16
            image: node:16-alpine@sha256:a1f9d027912b58a7c75be7716c97cfbc6d3099f3a97ed84aa490be9dee20e787
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 18
            image: node:18-alpine@sha256:8d6421d663b4c28fd3ebc498332f249011d118945588d0a35cb9bc4b8ca09d9e
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 19
            image: node:19-alpine@sha256:8ec543d4795e2e85af924a24f8acb039792ae9fe8a42ad5b4bf4c277ab34b62e
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 20
            image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 21
            image: node:21-alpine@sha256:78c45726ea205bbe2f23889470f03b46ac988d14b6d813d095e2e9909f586f93
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 22
            image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 23
            image: node:23-alpine@sha256:a34e14ef1df25b58258956049ab5a71ea7f0d498e41d0b514f4b8de09af09456
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 24
            image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 25
            image: node:25-alpine@sha256:bdf2cca6fe3dabd014ea60163eca3f0f7015fbd5c7ee1b0e9ccb4ced6eb02ef4
          - os: ubuntu-24.04-arm
            arch: arm64
            node: 26
            image: node:26-alpine@sha256:0b36e8c136b94cd4fcf02188228e76c31ad5872eef3fec8cbd2eee500cfd9e80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in Alpine container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace ${{ matrix.image }} sh -c "
            apk add --no-cache python3 make g++ &&
            npm install --ignore-scripts &&
            npx prebuildify --strip -t \$(node -p 'process.version.slice(1)') &&
            npm test &&
            npm run benchmark:ip-matcher &&
            for dir in prebuilds/*/; do
              platform=\$(basename \"\$dir\")
              mv \"\$dir/zen-internals-node.node\" \"prebuilds/zen-internals-node-\${platform}-musl-node${{ matrix.node }}.node\"
            done
          "

      - name: Upload prebuild
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-musl-${{ matrix.arch }}-node${{ matrix.node }}
          path: prebuilds/
          retention-days: 30
