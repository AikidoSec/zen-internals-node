[package]
name = "zen_ip_matcher_node"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
# Without std, the .node stays small and still loads on glibc 2.17.
zen_ip_matcher = { git = "https://github.com/AikidoSec/zen-internals", branch = "ip-matcher-crate", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
